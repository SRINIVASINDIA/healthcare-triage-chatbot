<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Triage Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Healthcare Triage Chatbot</h1>
            <p class="disclaimer">This is a prototype for preliminary symptom assessment only. Not a substitute for professional medical advice.</p>
        </header>
        
        <div id="chat-container">
            <div id="conversation-history"></div>
        </div>
        
        <div class="input-section">
            <textarea id="symptom-input" placeholder="Describe your symptoms..." rows="3"></textarea>
            <button id="submit-btn">Submit</button>
        </div>
        
        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <p>Analyzing symptoms...</p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
